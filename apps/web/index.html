<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#151515" />
    <link rel="icon" href="/favicon.ico?v=ras4" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=ras4" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      (() => {
        const THEME_STORAGE_KEY = "ras-code:theme";
        const APPEARANCE_STORAGE_KEY = "ras-code:theme-appearance-mode";
        const FOLLOW_SYSTEM_STORAGE_KEY = "ras-code:theme-follow-system";
        const isAppearance = (value) => value === "system" || value === "light" || value === "dark";
        const apply = (appearance) => {
          const isDark =
            appearance === "dark" ||
            (appearance === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          const background = isDark ? "#151515" : "#ffffff";
          document.documentElement.classList.toggle("dark", isDark);
          document.documentElement.style.backgroundColor = background;
          for (const meta of document.querySelectorAll('meta[name="theme-color"]')) {
            meta.setAttribute("content", background);
          }
        };

        try {
          const storedAppearance = window.localStorage.getItem(APPEARANCE_STORAGE_KEY);
          const storedTheme = window.localStorage.getItem(THEME_STORAGE_KEY);
          const storedFollowSystem = window.localStorage.getItem(FOLLOW_SYSTEM_STORAGE_KEY);
          const appearance = isAppearance(storedAppearance)
            ? storedAppearance
            : storedFollowSystem === "true"
              ? "system"
              : storedTheme === "light" || storedTheme === "dark"
                ? storedTheme
                : storedTheme === "t3-chat-dark"
                  ? "dark"
                  : "system";
          apply(appearance);
        } catch {
          apply("system");
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        --dock-icon-background: #ffffff;
        --dock-icon-empty: #ebedf0;
        --brand-low: #216e39;
        --brand-medium: #30a14e;
        --brand-high: #40c463;
        background: #ffffff;
        color: #262626;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }

      html.dark body {
        --dock-icon-background: #0d1117;
        --dock-icon-empty: #21262d;
        --brand-low: #006d32;
        --brand-medium: #26a641;
        --brand-high: #39d353;
        background: #151515;
        color: #f5f5f5;
      }

      #boot-shell {
        display: flex;
        min-height: 100%;
        align-items: center;
        justify-content: center;
        background-color: inherit;
        color: inherit;
      }

      #boot-shell-logo {
        width: 128px;
        height: 128px;
      }
    </style>
    <title>RAS Code</title>
  </head>
  <body>
    <div id="root">
      <div id="boot-shell">
        <svg
          id="boot-shell-logo"
          viewBox="0 0 128 128"
          role="img"
          aria-label="RAS Code splash screen"
        >
          <g transform="translate(2 2)">
            <rect x="40" y="24" width="12" height="12" rx="2" fill="var(--brand-high)" />
            <rect x="56" y="24" width="12" height="12" rx="2" fill="var(--brand-medium)" />
            <rect x="40" y="40" width="12" height="12" rx="2" fill="var(--brand-medium)" />
            <rect x="72" y="40" width="12" height="12" rx="2" fill="var(--brand-high)" />
            <rect x="40" y="56" width="12" height="12" rx="2" fill="var(--brand-high)" />
            <rect x="56" y="56" width="12" height="12" rx="2" fill="var(--brand-medium)" />
            <rect x="40" y="72" width="12" height="12" rx="2" fill="var(--brand-low)" />
            <rect x="72" y="72" width="12" height="12" rx="2" fill="var(--brand-high)" />
            <rect x="40" y="88" width="12" height="12" rx="2" fill="var(--brand-medium)" />
            <rect x="72" y="88" width="12" height="12" rx="2" fill="var(--brand-low)" />
          </g>
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
