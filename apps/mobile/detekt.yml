config:
  validation: true

build:
  maxIssues: 0

complexity:
  LongMethod:
    active: true
    threshold: 80
  TooManyFunctions:
    active: false

naming:
  # The Expo module packages are expo.modules.ras_code.*; renaming them changes
  # the native fingerprint and every module config for a cosmetic win. ktlint's
  # package-name rule is disabled in .editorconfig for the same reason.
  PackageNaming:
    active: false

style:
  MagicNumber:
    active: false
  MaxLineLength:
    active: true
    maxLineLength: 120
