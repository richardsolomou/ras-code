name: Release

# Canary ships every merge to main; stable ships once a day. A stable release
# derives its version by bumping the patch, so it lands exactly the version the
# canaries ahead of it were previewing. Tag pushes and workflow_dispatch remain
# available for a stable release on a version this cadence would not pick, such
# as a minor or major bump.
on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
      - "!v*-canary.*"
  schedule:
    # Off minute zero: GitHub delays scheduled runs most at the top of the hour.
    - cron: "3 9 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: false
        default: stable
        type: choice
        options:
          - stable
          - canary
      version:
        description: "Release version (for example 1.2.3 or v1.2.3)"
        required: false
        type: string

# A burst of merges collapses through the queue, not by canceling: the default
# `queue: single` keeps at most one run pending, and a newer merge replaces the
# one waiting. So a burst ships the release in flight plus the newest commit,
# rather than one release per commit.
#
# Deliberately not `cancel-in-progress` on canary. Canceling tears a release
# apart at whatever job boundary it lands on: npm and the GitHub release publish
# early, so a cancel after them leaves a version installable while the hosted
# web deploy and the AUR package never ship for it.
#
# Not `queue: max` either. GitHub rejects it combined with cancel-in-progress
# and fails the whole file, and the default single pending slot is what gives
# canary its collapsing behavior. The cost is that a run queued behind another
# replaces the one already waiting; stable only fires daily or on a deliberate
# tag, so two would have to queue within one release to lose anything.
concurrency:
  group: release-${{ ((github.event_name == 'push' && github.ref_type == 'branch') || inputs.channel == 'canary') && 'canary' || 'stable' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: none

jobs:
  # The daily stable release is the only trigger that can fire with nothing new
  # on main. Canary is driven by the merge itself, so it always has a change.
  check_changes:
    name: Check for changes since last stable release
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - id: check
        name: Compare HEAD to last stable tag
        run: |
          # Canary tags match the same glob, so drop them: the daily release
          # must compare against the last stable, not the last build of any kind.
          last_stable_tag=$(git tag --list 'v*.*.*' --sort=-creatordate | grep -v -- '-canary\.' | head -n 1)
          if [[ -z "$last_stable_tag" ]]; then
            echo "No previous stable tag found. Proceeding with release."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last_stable_sha=$(git rev-parse "$last_stable_tag^{commit}")
          head_sha=$(git rev-parse HEAD)

          if [[ "$last_stable_sha" == "$head_sha" ]]; then
            echo "No changes on main since last stable release ($last_stable_tag). Skipping."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected on main since $last_stable_tag ($last_stable_sha → $head_sha). Proceeding."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

  preflight:
    name: Preflight
    needs: [check_changes]
    # finalize pushes the stable version bump to main, which would otherwise
    # come straight back here as a canary release of that commit. Scoped to
    # branch pushes so a tag pointed at that same commit still releases.
    if: |
      !failure() && !cancelled() &&
      (github.event_name != 'schedule' || needs.check_changes.outputs.has_changes == 'true') &&
      (github.event_name != 'push' || github.ref_type != 'branch' ||
       !startsWith(github.event.head_commit.message, 'chore(release): prepare v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      statuses: read
    outputs:
      ci_green: ${{ steps.ci_status.outputs.ci_green }}
      release_channel: ${{ steps.release_meta.outputs.release_channel }}
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
      release_name: ${{ steps.release_meta.outputs.name }}
      short_sha: ${{ steps.release_meta.outputs.short_sha }}
      previous_tag: ${{ steps.previous_tag.outputs.previous_tag }}
      cli_dist_tag: ${{ steps.release_meta.outputs.cli_dist_tag }}
      is_prerelease: ${{ steps.release_meta.outputs.is_prerelease }}
      make_latest: ${{ steps.release_meta.outputs.make_latest }}
      ref: ${{ github.sha }}
    steps:
      - name: Wait for production relay deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          deadline=$((SECONDS + 900))
          while (( SECONDS < deadline )); do
            state="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/status" \
              --jq '[.statuses[] | select(.context == "Relay deploy / production")][0].state // "pending"')"
            case "$state" in
              success)
                echo "Production relay deployment passed for $GITHUB_SHA."
                exit 0
                ;;
              error|failure)
                echo "Production relay deployment failed for $GITHUB_SHA." >&2
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Production relay deployment did not finish within 15 minutes." >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
        env:
          pnpm_config_cache_dir: ${{ runner.temp }}/pnpm-metadata

      - id: release_meta
        name: Resolve release version
        shell: bash
        env:
          DISPATCH_CHANNEL: ${{ github.event.inputs.channel }}
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_RUN_NUMBER: ${{ github.run_number }}
        run: |
          # A push to main is a canary; a pushed tag, the daily schedule, and
          # workflow_dispatch default to stable.
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_TYPE}" == "branch" ]] ||
             [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${DISPATCH_CHANNEL:-stable}" == "canary" ]]; then
            node scripts/resolve-release-version.ts \
              --channel canary \
              --date "$(date -u +%Y%m%d)" \
              --run-number "$RELEASE_RUN_NUMBER" \
              --sha "$RELEASE_SHA" \
              --github-output

            echo "release_channel=canary" >> "$GITHUB_OUTPUT"
            echo "cli_dist_tag=canary" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The daily release derives its own version by bumping the patch.
          # A tag push or a dispatch names the version instead, which is how a
          # minor or major release gets cut.
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            node scripts/resolve-release-version.ts \
              --channel stable \
              --sha "$RELEASE_SHA" \
              --github-output

            echo "release_channel=stable" >> "$GITHUB_OUTPUT"
            echo "cli_dist_tag=latest" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            raw="${DISPATCH_VERSION}"
            if [[ -z "$raw" ]]; then
              echo "workflow_dispatch stable releases require the version input." >&2
              exit 1
            fi
          else
            raw="${GITHUB_REF_NAME}"
          fi

          version="${raw#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $raw" >&2
            exit 1
          fi

          echo "release_channel=stable" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "name=RAS Code v$version" >> "$GITHUB_OUTPUT"
          echo "cli_dist_tag=latest" >> "$GITHUB_OUTPUT"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - id: previous_tag
        name: Resolve previous release tag
        run: |
          node scripts/resolve-previous-release-tag.ts \
            --channel "${{ steps.release_meta.outputs.release_channel }}" \
            --current-tag "${{ steps.release_meta.outputs.tag }}" \
            --github-output

      # Share only the verification results, not the large registry metadata cache.
      - name: Upload dependency verification
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: release-dependency-verification
          path: ${{ runner.temp }}/pnpm-metadata/lockfile-verified.jsonl

      # Releases are cut from commits on main, which CI already checked,
      # typechecked and tested. When a completed CI run for this exact commit is
      # green, the quality job below is skipped; anything else (no run yet, still
      # running, failed, API error) runs the full suite here instead.
      - id: ci_status
        name: Check whether CI already passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusions="$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status completed \
            --json conclusion --jq '.[].conclusion' 2>/dev/null || true)"
          if grep -qx success <<< "$conclusions"; then
            echo "CI already passed for $GITHUB_SHA. Skipping release quality checks."
            echo "ci_green=true" >> "$GITHUB_OUTPUT"
          else
            echo "No successful completed CI run found for $GITHUB_SHA. Running release quality checks."
            echo "ci_green=false" >> "$GITHUB_OUTPUT"
          fi

  # The same gates as CI, split the same way: three server shards (apps/server
  # runs files serially, so sharding is the only way to spread them), one job
  # for every other package, and one for check + typecheck. Skipped entirely
  # when preflight found a green CI run for this commit.
  quality:
    name: Release quality (${{ matrix.name }})
    needs: [preflight]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' && needs.preflight.outputs.ci_green != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: check
            electron: true
            run: vp check && vp run typecheck
          - name: test
            electron: true
            run: vp run --parallel --concurrency-limit 4 --filter '!ras-code' --filter '!@t3tools/web' --filter '!@t3tools/monorepo' test
          - name: test web 1
            run: vp run --filter @t3tools/web test --shard 1/2
          - name: test web 2
            run: vp run --filter @t3tools/web test --shard 2/2
          - name: test server 1
            run: vp run --filter ras-code test --shard 1/3
          - name: test server 2
            run: vp run --filter ras-code test --shard 2/3
          - name: test server 3
            run: vp run --filter ras-code test --shard 3/3
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        if: matrix.electron
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Run
        run: ${{ matrix.run }}

  relay_public_config:
    name: Resolve RAS Connect public config
    # Consumes only the commit SHA, not preflight's resolved version, so it runs
    # alongside preflight instead of after it. The condition mirrors preflight's:
    # check_changes is skipped on non-schedule events (skipped is neither failure
    # nor success, so success() would be wrong here).
    needs: [check_changes]
    if: |
      !failure() && !cancelled() &&
      (github.event_name != 'schedule' || needs.check_changes.outputs.has_changes == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
    outputs:
      clerk_publishable_key: ${{ steps.public_config.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ steps.public_config.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ steps.public_config.outputs.clerk_cli_oauth_client_id }}
      hosted_app_url: ${{ steps.public_config.outputs.hosted_app_url }}
      relay_url: ${{ steps.public_config.outputs.relay_url }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RELAY_DOMAIN: ${{ vars.RELAY_DOMAIN }}
      RELAY_API_ZONE_NAME: ${{ vars.RELAY_API_ZONE_NAME }}
      CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      CLERK_JWT_TEMPLATE: ${{ vars.CLERK_JWT_TEMPLATE }}
      CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.CLERK_CLI_OAUTH_CLIENT_ID }}
      RAS_CODE_WEB_ROUTER_URL: ${{ vars.RAS_CODE_WEB_ROUTER_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          # No dependency cache: this job installs a filtered subset of the
          # workspace, and setup-vp saves whatever store the first job to finish
          # produced under the lockfile-wide key. A partial store then poisons
          # every full install after it. Only full-install jobs cache.
          cache: false
          run-install: |
            args:
              - --filter=ras-code-relay...

      - name: Configure Alchemy credentials
        uses: ./.github/actions/alchemy-credentials
        with:
          state-store-credentials: ${{ secrets.ALCHEMY_STATE_STORE_CREDENTIALS }}

      - id: relay_state
        name: Read production relay tracing config
        shell: bash
        run: |
          vp run --filter ras-code-relay deploy \
            --stage prod \
            --read-state \
            --github-output \
            --github-env-file "$RUNNER_TEMP/relay-client-tracing.env"

      - name: Upload relay client tracing config
        uses: actions/upload-artifact@v7
        with:
          name: relay-client-tracing-config
          path: ${{ runner.temp }}/relay-client-tracing.env
          if-no-files-found: error
          retention-days: 1

      - id: public_config
        name: Resolve production relay public config
        shell: bash
        run: |
          set -euo pipefail

          relay_domain="${RELAY_DOMAIN:-}"
          if [[ -z "$relay_domain" && -n "${RELAY_API_ZONE_NAME:-}" ]]; then
            relay_domain="relay.$RELAY_API_ZONE_NAME"
          fi
          required=(
            relay_domain
            CLERK_PUBLISHABLE_KEY
            CLERK_JWT_TEMPLATE
            CLERK_CLI_OAUTH_CLIENT_ID
            RAS_CODE_WEB_ROUTER_URL
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required relay deployment configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          echo "clerk_publishable_key=$CLERK_PUBLISHABLE_KEY" >> "$GITHUB_OUTPUT"
          echo "clerk_jwt_template=$CLERK_JWT_TEMPLATE" >> "$GITHUB_OUTPUT"
          echo "clerk_cli_oauth_client_id=$CLERK_CLI_OAUTH_CLIENT_ID" >> "$GITHUB_OUTPUT"
          echo "hosted_app_url=$RAS_CODE_WEB_ROUTER_URL" >> "$GITHUB_OUTPUT"
          echo "relay_url=https://$relay_domain" >> "$GITHUB_OUTPUT"

  # node-pty publishes no Linux prebuilt, so on Linux its binary is compiled
  # during install — which npm 12 skips unless the installing project opts in,
  # and neither `npx` nor a global install has a project to opt in with. We build
  # it here, on Linux, and both consumers take it from this job: the npm package
  # ships it so a Linux install needs no compiler, and the Windows artifact
  # carries the x64 one for its WSL backend, whose distro Node cannot load the
  # Windows/Electron binary. node-pty is N-API, so one binary per architecture
  # works across Node versions.
  build_linux_node_pty:
    name: Build node-pty (linux-${{ matrix.arch }})
    # Same gating as relay_public_config: only the commit SHA is needed, so this
    # runs alongside preflight. See the condition comment there.
    needs: [check_changes]
    if: |
      !failure() && !cancelled() &&
      (github.event_name != 'schedule' || needs.check_changes.outputs.has_changes == 'true')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          # No dependency cache: this job installs a filtered subset of the
          # workspace, and setup-vp saves whatever store the first job to finish
          # produced under the lockfile-wide key. A partial store then poisons
          # every full install after it. Only full-install jobs cache.
          cache: false
          run-install: |
            args:
              - --filter=ras-code...

      - name: Build node-pty linux-${{ matrix.arch }} prebuild
        shell: bash
        run: |
          set -euo pipefail
          # Resolve node-pty from apps/server (where it's a dependency) and build
          # its native binary from source for Linux. node-addon-api resolves from
          # node-pty's own dependency tree, so node-gyp has everything it needs.
          pty_pkg="$(node -e "console.log(require.resolve('node-pty/package.json', { paths: ['$GITHUB_WORKSPACE/apps/server'] }))")"
          pty_dir="$(dirname "$pty_pkg")"
          ( cd "$pty_dir" && npx --yes node-gyp rebuild )
          mkdir -p linux-prebuild
          cp "$pty_dir/build/Release/pty.node" linux-prebuild/pty.node
          file linux-prebuild/pty.node
          # The runner architecture is what makes this binary loadable on the
          # target, so a mismatched runner has to fail here rather than ship.
          case "${{ matrix.arch }}" in
            x64) expected="x86-64" ;;
            arm64) expected="aarch64" ;;
          esac
          file linux-prebuild/pty.node | grep -q "$expected"

      - name: Upload node-pty linux-${{ matrix.arch }} prebuild
        uses: actions/upload-artifact@v7
        with:
          name: node-pty-linux-${{ matrix.arch }}
          path: linux-prebuild/pty.node
          if-no-files-found: error

  build:
    name: Build ${{ matrix.label }}
    # build_linux_node_pty stays in `needs` so it runs first and its artifact is
    # available to download, but only the Windows matrix entry consumes it. We
    # therefore gate the job on preflight + relay (must succeed) WITHOUT requiring
    # build_linux_node_pty, so a failed Linux prebuild doesn't skip the macOS/Linux
    # builds. `!cancelled()` (not `!failure()`) lets the job run even when
    # build_linux_node_pty failed; the Windows-only download step below then fails
    # that single platform if the prebuild is missing.
    needs: [preflight, relay_public_config, build_linux_node_pty]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.relay_public_config.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      RAS_CODE_CLERK_PUBLISHABLE_KEY: ${{ needs.relay_public_config.outputs.clerk_publishable_key }}
      RAS_CODE_CLERK_JWT_TEMPLATE: ${{ needs.relay_public_config.outputs.clerk_jwt_template }}
      RAS_CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ needs.relay_public_config.outputs.clerk_cli_oauth_client_id }}
      RAS_CODE_HOSTED_APP_URL: ${{ needs.relay_public_config.outputs.hosted_app_url }}
      RAS_CODE_RELAY_URL: ${{ needs.relay_public_config.outputs.relay_url }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-latest
            platform: mac
            target: dmg
            arch: arm64
            rust_target: aarch64-apple-darwin
            resource_key: darwin-arm64
          - label: macOS x64
            runner: macos-latest
            platform: mac
            target: dmg
            arch: x64
            rust_target: x86_64-apple-darwin
            resource_key: darwin-x64
          - label: Linux x64
            runner: ubuntu-latest
            platform: linux
            target: AppImage
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
            resource_key: linux-x64
          - label: Windows x64
            runner: windows-latest
            platform: win
            target: nsis
            arch: x64
            rust_target: x86_64-pc-windows-msvc
            resource_key: win32-x64
          # - label: Windows arm64
          #   runner: windows-11-arm
          #   platform: win
          #   target: nsis
          #   arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          # No dependency cache: this job installs a filtered subset of the
          # workspace, and setup-vp saves whatever store the first job to finish
          # produced under the lockfile-wide key. A partial store then poisons
          # every full install after it. Only full-install jobs cache.
          cache: false
          run-install: false

      - name: Resolve Windows package cache path
        if: matrix.platform == 'win'
        id: package_cache_path
        shell: pwsh
        run: '"path=$(vp pm cache dir)" >> $env:GITHUB_OUTPUT'

      - name: Cache Windows packages
        if: matrix.platform == 'win'
        uses: actions/cache@v6
        with:
          path: ${{ steps.package_cache_path.outputs.path }}
          key: windows-release-packages-v1-${{ matrix.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

      # pnpm checks the lockfile and policy before reusing this result. A missing
      # artifact leaves the cache empty, so installation runs the checks again.
      - name: Download dependency verification
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: release-dependency-verification
          path: ${{ runner.temp }}/pnpm-metadata

      - name: Install desktop dependencies
        env:
          pnpm_config_cache_dir: ${{ runner.temp }}/pnpm-metadata
        run: vp install --filter=@t3tools/desktop... --filter=ras-code... --filter=@t3tools/scripts...

      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@v6
        with:
          path: native/resource-monitor/target/${{ matrix.rust_target }}/release/ras-resource-monitor${{ matrix.platform == 'win' && '.exe' || '' }}
          key: resource-monitor-${{ matrix.rust_target }}-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Download relay client tracing config
        uses: actions/download-artifact@v8
        with:
          name: relay-client-tracing-config
          path: ${{ runner.temp }}/relay-client-tracing

      - name: Load relay client tracing config
        shell: bash
        run: |
          config_path="$RUNNER_TEMP/relay-client-tracing/relay-client-tracing.env"
          tracing_token="$(sed -n 's/^RAS_CODE_RELAY_CLIENT_OTLP_TRACES_TOKEN=//p' "$config_path")"
          echo "::add-mask::$tracing_token"
          cat "$config_path" >> "$GITHUB_ENV"

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - name: Download WSL node-pty prebuild
        if: matrix.platform == 'win'
        uses: actions/download-artifact@v7
        with:
          name: node-pty-linux-x64
          path: wsl-prebuild

      - name: Install Linux desktop build libraries
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config
          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
              sudo apt-get install -y imagemagick
          fi

          if command -v magick >/dev/null 2>&1; then
              magick -version
          else
              convert -version
          fi

      - name: Prepare Azure Trusted Signing
        if: matrix.platform == 'win'
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          $ErrorActionPreference = "Stop"

          $requiredSecrets = @(
            $env:AZURE_TENANT_ID,
            $env:AZURE_CLIENT_ID,
            $env:AZURE_CLIENT_SECRET,
            $env:AZURE_TRUSTED_SIGNING_ENDPOINT,
            $env:AZURE_TRUSTED_SIGNING_ACCOUNT_NAME,
            $env:AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME,
            $env:AZURE_TRUSTED_SIGNING_PUBLISHER_NAME
          )
          if ($requiredSecrets | Where-Object { [string]::IsNullOrWhiteSpace($_) }) {
            Write-Host "Azure Trusted Signing disabled; skipping TrustedSigning module preparation."
            exit 0
          }

          try {
            Install-PackageProvider `
              -Name NuGet `
              -MinimumVersion 2.8.5.201 `
              -Force `
              -Scope CurrentUser `
              -ErrorAction Stop
          } catch {
            Write-Warning "Could not bootstrap NuGet package provider. Continuing because the runner may already have a usable provider. $($_.Exception.Message)"
          }

          Install-Module `
            -Name TrustedSigning `
            -MinimumVersion 0.5.0 `
            -Force `
            -AllowClobber `
            -Repository PSGallery `
            -Scope CurrentUser `
            -ErrorAction Stop

          Import-Module TrustedSigning -MinimumVersion 0.5.0 -Force
          Get-Command Invoke-TrustedSigning -ErrorAction Stop

          $moduleRoots = @(
            [System.IO.Path]::Combine([Environment]::GetFolderPath("MyDocuments"), "PowerShell", "Modules"),
            [System.IO.Path]::Combine([Environment]::GetFolderPath("MyDocuments"), "WindowsPowerShell", "Modules"),
            [System.IO.Path]::Combine($env:ProgramFiles, "PowerShell", "Modules"),
            [System.IO.Path]::Combine($env:ProgramFiles, "WindowsPowerShell", "Modules")
          )
          $modulePathEntries = @($moduleRoots + ($env:PSModulePath -split ";")) |
            Where-Object { $_ -and (Test-Path $_) } |
            Select-Object -Unique
          "PSModulePath=$($modulePathEntries -join ';')" >> $env:GITHUB_ENV

      - name: Build desktop artifact
        shell: bash
        env:
          pnpm_config_cache_dir: ${{ runner.temp }}/pnpm-metadata
          RAS_CODE_DESKTOP_REUSE_RESOURCE_MONITOR: ${{ steps.resource_monitor_cache.outputs.cache-hit == 'true' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
          RAS_CODE_CLERK_PASSKEY_RP_DOMAINS: ${{ vars.CLERK_PASSKEY_RP_DOMAINS }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          args=(
            --platform "${{ matrix.platform }}"
            --target "${{ matrix.target }}"
            --arch "${{ matrix.arch }}"
            --build-version "${{ needs.preflight.outputs.version }}"
            --verbose
          )

          has_all() {
            for value in "$@"; do
              if [[ -z "$value" ]]; then
                return 1
              fi
            done
            return 0
          }

          if [[ "${{ matrix.platform }}" == "mac" ]]; then
            if has_all "$CSC_LINK" "$CSC_KEY_PASSWORD" "$APPLE_API_KEY" "$APPLE_API_KEY_ID" "$APPLE_API_ISSUER"; then
              if ! has_all "$APPLE_TEAM_ID" "$MACOS_PROVISIONING_PROFILE"; then
                echo "macOS signing is configured, but APPLE_TEAM_ID or MACOS_PROVISIONING_PROFILE is missing." >&2
                exit 1
              fi

              key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
              printf '%s' "$APPLE_API_KEY" > "$key_path"
              export APPLE_API_KEY="$key_path"

              profile_path="$RUNNER_TEMP/ras-code.provisionprofile"
              printf '%s' "$MACOS_PROVISIONING_PROFILE" | base64 -D > "$profile_path"
              security cms -D -i "$profile_path" >/dev/null
              export RAS_CODE_APPLE_TEAM_ID="$APPLE_TEAM_ID"
              export RAS_CODE_MACOS_PROVISIONING_PROFILE="$profile_path"

              echo "macOS signing enabled."
              args+=(--signed)
            else
              echo "macOS signing disabled (missing one or more Apple signing secrets)."
            fi
          elif [[ "${{ matrix.platform }}" == "win" ]]; then
            # Bundle the Linux node-pty binary built by the build_linux_node_pty job
            # so the packaged WSL backend ships a ready binary (no first-launch
            # compile). Required for a working WSL backend on Windows.
            args+=(--wsl-prebuild "$GITHUB_WORKSPACE/wsl-prebuild/pty.node")
            if has_all \
              "$AZURE_TENANT_ID" \
              "$AZURE_CLIENT_ID" \
              "$AZURE_CLIENT_SECRET" \
              "$AZURE_TRUSTED_SIGNING_ENDPOINT" \
              "$AZURE_TRUSTED_SIGNING_ACCOUNT_NAME" \
              "$AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME" \
              "$AZURE_TRUSTED_SIGNING_PUBLISHER_NAME"; then
              echo "Windows signing enabled (Azure Trusted Signing)."
              args+=(--signed)
            else
              echo "Windows signing disabled (missing one or more Azure Trusted Signing secrets)."
            fi
          else
            echo "Signing disabled for ${{ matrix.platform }}."
          fi

          vp run dist:desktop:artifact "${args[@]}"

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish

          shopt -s nullglob
          for pattern in \
            "release/*.dmg" \
            "release/*.zip" \
            "release/*.AppImage" \
            "release/*.exe" \
            "release/*.blockmap" \
            "release/*.yml"; do
            for file in $pattern; do
              cp "$file" release-publish/
            done
          done

          if [[ "${{ matrix.platform }}" == "mac" && "${{ matrix.arch }}" != "arm64" ]]; then
            shopt -s nullglob
            for manifest in release-publish/*-mac.yml; do
              mv "$manifest" "${manifest%.yml}-${{ matrix.arch }}.yml"
            done
          fi

          # Enable if Windows arm64 builds are enabled.
          # Windows updater metadata is channel-specific (for example
          # "latest.yml" or "canary.yml"). Suffix each per-arch copy so the
          # release job can merge matching arm64/x64 manifests back into one
          # canonical manifest per channel.
          # if [[ "${{ matrix.platform }}" == "win" ]]; then
          #   shopt -s nullglob
          #   for manifest in release-publish/*.yml; do
          #     mv "$manifest" "${manifest%.yml}-win-${{ matrix.arch }}.yml"
          #   done
          # fi

      - name: Collect resource monitor
        shell: bash
        run: |
          set -euo pipefail
          binary_name="ras-resource-monitor"
          if [[ "${{ matrix.platform }}" == "win" ]]; then
            binary_name="${binary_name}.exe"
          fi
          source_path="native/resource-monitor/target/${{ matrix.rust_target }}/release/${binary_name}"
          target_dir="resource-monitor-publish/${{ matrix.resource_key }}"
          mkdir -p "$target_dir"
          cp "$source_path" "$target_dir/$binary_name"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error

      - name: Upload resource monitor
        uses: actions/upload-artifact@v7
        with:
          name: resource-monitor-${{ matrix.resource_key }}
          path: resource-monitor-publish/${{ matrix.resource_key }}/*
          if-no-files-found: error

  publish_cli:
    name: Publish CLI to npm
    needs: [preflight, relay_public_config, quality, build, build_linux_node_pty]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' && needs.relay_public_config.result == 'success' && (needs.quality.result == 'success' || needs.quality.result == 'skipped') && needs.build.result == 'success' && needs.build_linux_node_pty.result == 'success' }}
    runs-on: ubuntu-24.04 # ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      RAS_CODE_CLERK_PUBLISHABLE_KEY: ${{ needs.relay_public_config.outputs.clerk_publishable_key }}
      RAS_CODE_CLERK_JWT_TEMPLATE: ${{ needs.relay_public_config.outputs.clerk_jwt_template }}
      RAS_CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ needs.relay_public_config.outputs.clerk_cli_oauth_client_id }}
      RAS_CODE_HOSTED_APP_URL: ${{ needs.relay_public_config.outputs.hosted_app_url }}
      RAS_CODE_RELAY_URL: ${{ needs.relay_public_config.outputs.relay_url }}
      # Credentials the PostHog CLI reads from the environment. Absent by
      # default, which skips source map upload and leaves the release unchanged.
      POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
      POSTHOG_CLI_PROJECT_ID: ${{ secrets.POSTHOG_CLI_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          # No dependency cache: this job installs a filtered subset of the
          # workspace, and setup-vp saves whatever store the first job to finish
          # produced under the lockfile-wide key. A partial store then poisons
          # every full install after it. Only full-install jobs cache.
          cache: false
          run-install: |
            args:
              - --filter=ras-code...
              - --filter=@t3tools/web...
              - --filter=@t3tools/scripts...

      - name: Download relay client tracing config
        uses: actions/download-artifact@v8
        with:
          name: relay-client-tracing-config
          path: ${{ runner.temp }}/relay-client-tracing

      - name: Load relay client tracing config
        shell: bash
        run: |
          config_path="$RUNNER_TEMP/relay-client-tracing/relay-client-tracing.env"
          tracing_token="$(sed -n 's/^RAS_CODE_RELAY_CLIENT_OTLP_TRACES_TOKEN=//p' "$config_path")"
          echo "::add-mask::$tracing_token"
          cat "$config_path" >> "$GITHUB_ENV"

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      # The ras-code build task depends on @t3tools/web#build, so the web client is
      # built (once) as part of this step.
      - name: Build CLI package
        run: vp run --filter ras-code build

      # PostHog matches a server stack frame to its source map by the chunk id
      # that `sourcemap inject` writes into the bundle, so injection must run
      # before publish while upload can follow it. Both are gated on the upload
      # credentials and never fail the release: an unresolved frame is a lesser
      # problem than a blocked ship.
      - name: Inject PostHog source map chunk IDs
        if: ${{ env.POSTHOG_CLI_API_KEY != '' && env.POSTHOG_CLI_PROJECT_ID != '' }}
        continue-on-error: true
        run: |
          npm install --global @posthog/cli@0.16.1
          posthog-cli --host https://us.posthog.com sourcemap inject \
            --directory apps/server/dist \
            --release-name ras-code \
            --release-version "${{ needs.preflight.outputs.version }}"

      - name: Download resource monitors
        uses: actions/download-artifact@v8
        with:
          pattern: resource-monitor-*
          path: ${{ runner.temp }}/resource-monitors

      - name: Bundle resource monitors into CLI package
        shell: bash
        run: |
          set -euo pipefail
          for artifact_dir in "$RUNNER_TEMP"/resource-monitors/resource-monitor-*; do
            resource_key="${artifact_dir##*/resource-monitor-}"
            target_dir="apps/server/dist/resource-monitor/${resource_key}"
            mkdir -p "$target_dir"
            cp "$artifact_dir"/ras-resource-monitor* "$target_dir/"
            chmod +x "$target_dir"/ras-resource-monitor 2>/dev/null || true
          done

      - name: Download node-pty Linux prebuilds
        uses: actions/download-artifact@v8
        with:
          pattern: node-pty-linux-*
          path: ${{ runner.temp }}/node-pty-prebuilds

      # Linux is the only platform node-pty ships no prebuild for, so without
      # these the package cannot start unless the installing machine both has a
      # compiler and let npm run the build script.
      - name: Bundle node-pty prebuilds into CLI package
        shell: bash
        run: |
          set -euo pipefail
          for artifact_dir in "$RUNNER_TEMP"/node-pty-prebuilds/node-pty-linux-*; do
            arch="${artifact_dir##*/node-pty-linux-}"
            target_dir="apps/server/dist/prebuilds/linux-${arch}"
            mkdir -p "$target_dir"
            cp "$artifact_dir/pty.node" "$target_dir/pty.node"
          done
          # Publishing without them is the failure this job exists to prevent.
          test -f apps/server/dist/prebuilds/linux-x64/pty.node
          test -f apps/server/dist/prebuilds/linux-arm64/pty.node

      - name: Publish CLI package
        run: node apps/server/scripts/cli.ts publish --tag "${{ needs.preflight.outputs.cli_dist_tag }}" --app-version "${{ needs.preflight.outputs.version }}" --verbose

      - name: Upload PostHog server source maps
        if: ${{ env.POSTHOG_CLI_API_KEY != '' && env.POSTHOG_CLI_PROJECT_ID != '' }}
        continue-on-error: true
        run: |
          posthog-cli --host https://us.posthog.com sourcemap upload \
            --directory apps/server/dist \
            --release-name ras-code \
            --release-version "${{ needs.preflight.outputs.version }}"

  release:
    name: Publish GitHub Release
    needs: [preflight, build, publish_cli]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' && needs.build.result == 'success' && needs.publish_cli.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          # No dependency cache: this job installs a filtered subset of the
          # workspace, and setup-vp saves whatever store the first job to finish
          # produced under the lockfile-wide key. A partial store then poisons
          # every full install after it. Only full-install jobs cache.
          cache: false
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Download all desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Merge macOS updater manifests
        run: |
          shopt -s nullglob
          for x64_manifest in release-assets/*-mac-x64.yml; do
            arm64_manifest="${x64_manifest%-x64.yml}.yml"
            if [[ -f "$arm64_manifest" ]]; then
              node scripts/merge-update-manifests.ts --platform mac "$arm64_manifest" "$x64_manifest"
              rm -f "$x64_manifest"
            fi
          done

      - name: Publish release
        if: needs.preflight.outputs.previous_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: ${{ needs.preflight.outputs.release_name }}
          generate_release_notes: true
          previous_tag: ${{ needs.preflight.outputs.previous_tag }}
          prerelease: ${{ needs.preflight.outputs.is_prerelease }}
          make_latest: ${{ needs.preflight.outputs.make_latest }}
          files: |
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.AppImage
            release-assets/*.exe
            release-assets/*.blockmap
            release-assets/*.yml
          fail_on_unmatched_files: true
          token: ${{ github.token }}

      - name: Publish first release
        if: needs.preflight.outputs.previous_tag == ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: ${{ needs.preflight.outputs.release_name }}
          generate_release_notes: true
          prerelease: ${{ needs.preflight.outputs.is_prerelease }}
          make_latest: ${{ needs.preflight.outputs.make_latest }}
          files: |
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.AppImage
            release-assets/*.exe
            release-assets/*.blockmap
            release-assets/*.yml
          fail_on_unmatched_files: true
          token: ${{ github.token }}

  publish_aur:
    name: Publish AUR package
    needs: [preflight, release]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' && needs.release.result == 'success' }}
    uses: ./.github/workflows/publish-aur.yml
    with:
      release_tag: ${{ needs.preflight.outputs.tag }}
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

  # Mobile stable follows full releases; every merge to main goes to the mobile
  # canary channel from mobile-eas-production.yml's own push trigger.
  publish_mobile_ota:
    name: Publish mobile production OTA
    needs: [preflight, release]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' && needs.release.result == 'success' && needs.preflight.outputs.release_channel == 'stable' }}
    uses: ./.github/workflows/mobile-eas-production.yml
    with:
      mode: release
      channel: production
    secrets: inherit

  deploy_web:
    name: Deploy hosted web app
    needs: [preflight, relay_public_config, release]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' && needs.relay_public_config.result == 'success' && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAS_CODE_CLERK_PUBLISHABLE_KEY: ${{ needs.relay_public_config.outputs.clerk_publishable_key }}
      RAS_CODE_CLERK_JWT_TEMPLATE: ${{ needs.relay_public_config.outputs.clerk_jwt_template }}
      RAS_CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ needs.relay_public_config.outputs.clerk_cli_oauth_client_id }}
      RAS_CODE_HOSTED_APP_URL: ${{ needs.relay_public_config.outputs.hosted_app_url }}
      RAS_CODE_RELAY_URL: ${{ needs.relay_public_config.outputs.relay_url }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      RAS_CODE_WEB_ROUTER_URL: ${{ vars.RAS_CODE_WEB_ROUTER_URL }}
      RAS_CODE_WEB_CANARY_DOMAIN: ${{ vars.RAS_CODE_WEB_CANARY_DOMAIN }}
      RAS_CODE_WEB_ZONE_ID: ${{ vars.RAS_CODE_WEB_ZONE_ID }}
      ALCHEMY_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          # No dependency cache: this job installs a filtered subset of the
          # workspace, and setup-vp saves whatever store the first job to finish
          # produced under the lockfile-wide key. A partial store then poisons
          # every full install after it. Only full-install jobs cache.
          cache: false
          run-install: |
            args:
              - --filter=@t3tools/scripts...
              - --filter=@t3tools/web...
              - --filter=ras-code-web-infra...

      - name: Download relay client tracing config
        uses: actions/download-artifact@v8
        with:
          name: relay-client-tracing-config
          path: ${{ runner.temp }}/relay-client-tracing

      - name: Load relay client tracing config
        shell: bash
        run: |
          config_path="$RUNNER_TEMP/relay-client-tracing/relay-client-tracing.env"
          tracing_token="$(sed -n 's/^RAS_CODE_RELAY_CLIENT_OTLP_TRACES_TOKEN=//p' "$config_path")"
          echo "::add-mask::$tracing_token"
          cat "$config_path" >> "$GITHUB_ENV"

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - name: Refresh release lockfile
        run: vp install --lockfile-only --ignore-scripts

      - name: Configure Alchemy credentials
        uses: ./.github/actions/alchemy-credentials
        with:
          state-store-credentials: ${{ secrets.ALCHEMY_STATE_STORE_CREDENTIALS }}

      - name: Deploy channel
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "Missing Cloudflare credentials: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID." >&2
            exit 1
          fi

          if [[ -z "${RAS_CODE_WEB_ROUTER_URL:-}" || -z "${RAS_CODE_WEB_CANARY_DOMAIN:-}" ]]; then
            echo "Missing one or more required hosted web variables: RAS_CODE_WEB_ROUTER_URL, RAS_CODE_WEB_CANARY_DOMAIN." >&2
            exit 1
          fi

          # Only the stable channel attaches Worker routes, so only it needs the zone.
          if [[ "${{ needs.preflight.outputs.release_channel }}" == "stable" && -z "${RAS_CODE_WEB_ZONE_ID:-}" ]]; then
            echo "Missing required hosted web variable: RAS_CODE_WEB_ZONE_ID." >&2
            exit 1
          fi

          if [[ "${{ needs.preflight.outputs.release_channel }}" == "stable" ]]; then
            channel=latest
          else
            channel=canary
          fi

          echo "Deploying hosted web app for the $channel channel."
          APP_VERSION="${{ needs.preflight.outputs.version }}" \
          VITE_HOSTED_APP_URL="$RAS_CODE_WEB_ROUTER_URL" \
          VITE_HOSTED_APP_CHANNEL="$channel" \
            vp run --filter ras-code-web-infra deploy --stage "$channel" --yes

  finalize:
    name: Finalize release
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' && needs.release.result == 'success' && needs.preflight.outputs.release_channel == 'stable' }}
    needs: [preflight, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: app_token
        name: Mint release app token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}
          persist-credentials: true
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - id: app_bot
        name: Resolve GitHub App bot identity
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          APP_SLUG: ${{ steps.app_token.outputs.app-slug }}
        run: |
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          echo "name=${APP_SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${user_id}+${APP_SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          # No dependency cache: this job installs a filtered subset of the
          # workspace, and setup-vp saves whatever store the first job to finish
          # produced under the lockfile-wide key. A partial store then poisons
          # every full install after it. Only full-install jobs cache.
          cache: false
          run-install: |
            args:
              - --filter=@t3tools/scripts...
              - --filter=@t3tools/oxlint-plugin-ras-code...

      - id: update_versions
        name: Update version strings
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: node scripts/update-release-package-versions.ts "$RELEASE_VERSION" --github-output

      - name: Format package.json files
        if: steps.update_versions.outputs.changed == 'true'
        run: vp fmt apps/server/package.json apps/desktop/package.json apps/web/package.json packages/contracts/package.json

      - name: Refresh lockfile
        if: steps.update_versions.outputs.changed == 'true'
        run: vp install --lockfile-only --ignore-scripts

      - name: Commit and push version bump
        if: steps.update_versions.outputs.changed == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          if git diff --quiet -- apps/server/package.json apps/desktop/package.json apps/web/package.json packages/contracts/package.json pnpm-lock.yaml; then
            echo "No version changes to commit."
            exit 0
          fi

          git config user.name "${{ steps.app_bot.outputs.name }}"
          git config user.email "${{ steps.app_bot.outputs.email }}"

          git add apps/server/package.json apps/desktop/package.json apps/web/package.json packages/contracts/package.json pnpm-lock.yaml
          git commit -m "chore(release): prepare $RELEASE_TAG"
          git push origin HEAD:main
