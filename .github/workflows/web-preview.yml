name: Web Preview

# Label a PR `preview:web` to get a hosted-web preview Worker for that push and
# every subsequent push. The preview deploys to its own Alchemy stage (`pr-<n>`)
# and carries no custom domain, so the latest/canary channel domains are never
# touched. Closing the PR, or removing the label, destroys the stage.
#
# The build intentionally omits the RAS Connect cloud config (Clerk keys, relay
# URL): previews boot as the hosted-static app with manual pairing only. Pair a
# server into a preview with `ras pair --tailscale` (or any reachable HTTPS
# backend) and open the pairing URL against the preview origin.
#
# The preview must be opened at the exact URL from the PR comment. Vite bakes
# that URL in as the hosted origin and `isHostedStaticApp` matches on origin, so
# any other hostname will not self-identify as the hosted app.

on:
  pull_request:
    types: [labeled, unlabeled, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: web-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
  RAS_CODE_WEB_ROUTER_URL: ${{ vars.RAS_CODE_WEB_ROUTER_URL }}
  RAS_CODE_WEB_CANARY_DOMAIN: ${{ vars.RAS_CODE_WEB_CANARY_DOMAIN }}
  ALCHEMY_TELEMETRY_DISABLED: "1"

jobs:
  deploy:
    name: Deploy web preview
    # Same-repo PRs only: fork PRs do not receive the Cloudflare credentials, and
    # this workflow should skip rather than fail for them. On `labeled` events,
    # only the preview label itself triggers a deploy.
    if: >-
      github.event.action != 'closed' &&
      github.event.action != 'unlabeled' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview:web') &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview:web')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@ras-code/scripts...
              - --filter=@ras-code/web...
              - --filter=ras-code-web-infra...

      - name: Configure Alchemy credentials
        uses: ./.github/actions/alchemy-credentials
        with:
          state-store-credentials: ${{ secrets.ALCHEMY_STATE_STORE_CREDENTIALS }}

      - id: deploy
        name: Deploy preview
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "Missing Cloudflare credentials: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID." >&2
            exit 1
          fi

          if [[ -z "${CLOUDFLARE_WORKERS_SUBDOMAIN:-}" ]]; then
            echo "Missing CLOUDFLARE_WORKERS_SUBDOMAIN; a preview URL cannot be derived without it." >&2
            exit 1
          fi

          stage="pr-${PR_NUMBER}"

          # Mirrors previewUrl() in infra/web/src/deployment.ts. The URL has to be
          # known before the build, because Vite bakes it in as the hosted origin.
          preview_url="https://ras-code-web-${stage}.${CLOUDFLARE_WORKERS_SUBDOMAIN}.workers.dev"

          echo "Deploying $stage to $preview_url"
          VITE_HOSTED_APP_URL="$preview_url" \
            vp run --filter ras-code-web-infra deploy --stage "$stage" --yes

          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = "<!-- web-preview-deploy -->";
            const body = [
              marker,
              "### Web preview",
              "",
              `${process.env.PREVIEW_URL} (for ${process.env.HEAD_SHA.slice(0, 7)})`,
              "",
              "Open this exact URL — the hosted-app origin is baked in at build time.",
              "Pair a server into it with `ras pair --tailscale`, or paste a host + pairing",
              "code under Settings → Connections.",
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            const existing = comments.find((comment) => comment.body?.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }

  teardown:
    name: Destroy web preview
    # A preview Worker outlives its pull request unless something removes it, so
    # closing the PR or dropping the label tears the stage down.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'closed' ||
       (github.event.action == 'unlabeled' && github.event.label.name == 'preview:web'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=ras-code-web-infra...

      - name: Configure Alchemy credentials
        uses: ./.github/actions/alchemy-credentials
        with:
          state-store-credentials: ${{ secrets.ALCHEMY_STATE_STORE_CREDENTIALS }}

      - name: Destroy preview stage
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "Missing Cloudflare credentials; nothing to destroy without them." >&2
            exit 1
          fi

          stage="pr-${PR_NUMBER}"
          echo "Destroying $stage"
          vp run --filter ras-code-web-infra destroy --stage "$stage" --yes
