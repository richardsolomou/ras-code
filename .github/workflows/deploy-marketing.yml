name: Deploy marketing site

on:
  push:
    branches:
      - main
    paths:
      - apps/marketing/**
      - infra/marketing/**
      - .github/workflows/deploy-marketing.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketing-production
  cancel-in-progress: false

jobs:
  deploy_marketing:
    name: Deploy marketing site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      RAS_CODE_MARKETING_DOMAIN: ${{ vars.RAS_CODE_MARKETING_DOMAIN }}
      ALCHEMY_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=ras-code-marketing-infra...

      - name: Configure Alchemy credentials
        uses: ./.github/actions/alchemy-credentials
        with:
          state-store-credentials: ${{ secrets.ALCHEMY_STATE_STORE_CREDENTIALS }}

      - name: Deploy marketing production stage
        run: vp run --filter ras-code-marketing-infra deploy --stage prod --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
