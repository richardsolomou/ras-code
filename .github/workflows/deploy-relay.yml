name: Deploy RAS Connect relay

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: none
  statuses: write

concurrency:
  group: relay-production
  cancel-in-progress: false

jobs:
  deploy_relay:
    name: Deploy production relay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      RELAY_DATABASE_HOST: ${{ vars.RELAY_DATABASE_HOST }}
      RELAY_DATABASE_NAME: ${{ vars.RELAY_DATABASE_NAME }}
      RELAY_DATABASE_USER: ${{ vars.RELAY_DATABASE_USER }}
      POSTHOG_OTLP_TRACES_URL: ${{ vars.POSTHOG_OTLP_TRACES_URL }}
      RELAY_DOMAIN: ${{ vars.RELAY_DOMAIN }}
      RELAY_API_ZONE_NAME: ${{ vars.RELAY_API_ZONE_NAME }}
      RELAY_GATEWAY_ZONE_NAME: ${{ vars.RELAY_GATEWAY_ZONE_NAME }}
      RELAY_GATEWAY_DOMAIN: ${{ vars.RELAY_GATEWAY_DOMAIN }}
      RELAY_ENDPOINT_NAMESPACE: ${{ vars.RELAY_ENDPOINT_NAMESPACE }}
      CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      CLERK_JWT_AUDIENCE: ${{ vars.CLERK_JWT_AUDIENCE }}
      APNS_ENVIRONMENT: ${{ vars.APNS_ENVIRONMENT }}
      APNS_TEAM_ID: ${{ vars.APNS_TEAM_ID }}
      APNS_KEY_ID: ${{ vars.APNS_KEY_ID }}
      APNS_BUNDLE_ID: ${{ vars.APNS_BUNDLE_ID }}
      ALCHEMY_TELEMETRY_DISABLED: "1"
      RELAY_MIGRATION_PORT: "45432"
      CLOUDFLARED_VERSION: "2026.8.2"
      CLOUDFLARED_SHA256: "fcfb02b575a52ca1af2e3267af4e1517bcdeb30ac48c834c69abaed3c0576ad2"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=ras-code-relay...

      - name: Configure Alchemy credentials
        uses: ./.github/actions/alchemy-credentials
        with:
          state-store-credentials: ${{ secrets.ALCHEMY_STATE_STORE_CREDENTIALS }}

      - name: Open an Access tunnel to the relay database
        env:
          RELAY_DATABASE_HOST: ${{ vars.RELAY_DATABASE_HOST }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.RELAY_DATABASE_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.RELAY_DATABASE_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          curl -fsSL -o cloudflared \
            "https://github.com/cloudflare/cloudflared/releases/download/$CLOUDFLARED_VERSION/cloudflared-linux-amd64"
          echo "$CLOUDFLARED_SHA256  cloudflared" | sha256sum -c -
          chmod +x cloudflared

          nohup ./cloudflared access tcp \
            --hostname "$RELAY_DATABASE_HOST" \
            --url "127.0.0.1:$RELAY_MIGRATION_PORT" \
            --service-token-id "$TUNNEL_SERVICE_TOKEN_ID" \
            --service-token-secret "$TUNNEL_SERVICE_TOKEN_SECRET" \
            > cloudflared.log 2>&1 &
          echo "$!" > cloudflared.pid

          for attempt in $(seq 1 30); do
            if nc -z 127.0.0.1 "$RELAY_MIGRATION_PORT"; then
              echo "Access tunnel is listening on 127.0.0.1:$RELAY_MIGRATION_PORT"
              exit 0
            fi
            sleep 1
          done

          echo "Access tunnel did not come up within 30s." >&2
          cat cloudflared.log >&2
          exit 1

      - name: Deploy production relay stage
        id: deploy
        run: vp run --filter ras-code-relay deploy --stage prod --yes --github-output
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELAY_DATABASE_PASSWORD: ${{ secrets.RELAY_DATABASE_PASSWORD }}
          RELAY_DATABASE_ACCESS_CLIENT_ID: ${{ secrets.RELAY_DATABASE_ACCESS_CLIENT_ID }}
          RELAY_DATABASE_ACCESS_CLIENT_SECRET: ${{ secrets.RELAY_DATABASE_ACCESS_CLIENT_SECRET }}
          RELAY_MIGRATION_DATABASE_URL: postgres://${{ vars.RELAY_DATABASE_USER }}:${{ secrets.RELAY_DATABASE_PASSWORD }}@127.0.0.1:${{ env.RELAY_MIGRATION_PORT }}/${{ vars.RELAY_DATABASE_NAME }}
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}

      - name: Close the Access tunnel
        if: always()
        run: |
          if [[ -f cloudflared.pid ]]; then
            kill "$(cat cloudflared.pid)" 2>/dev/null || true
          fi

      - name: Publish relay deploy commit status
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const succeeded = "${{ steps.deploy.outcome }}" === "success";
            const result = "${{ steps.deploy.outputs.result }}";
            const changed = "${{ steps.deploy.outputs.changed }}" === "true";
            const description = succeeded
              ? changed
                ? "Relay production deploy applied infrastructure changes."
                : result === "noop"
                  ? "Relay production deploy was a no-op."
                  : `Relay production deploy completed with result: ${result}.`
              : "Relay production deployment failed.";

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: succeeded ? "success" : "error",
              context: "Relay deploy / production",
              description,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
