<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { --background: #ffffff; --border: #d0d7de; --empty: #ebedf0; --low: #216e39; --medium: #30a14e; --high: #40c463; }
    @media (prefers-color-scheme: dark) { :root { --background: #0d1117; --border: #30363d; --empty: #21262d; --low: #006d32; --medium: #26a641; --high: #39d353; } }
  </style>
  <defs>
    <pattern id="empty-cells" x="8" y="8" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" rx="2" fill="var(--empty)" />
    </pattern>
  </defs>
  <rect x="0.5" y="0.5" width="127" height="127" rx="12" fill="var(--background)" stroke="var(--border)" />
  <g transform="translate(2 2)">
  <rect x="8" y="8" width="108" height="108" fill="url(#empty-cells)" />
  <rect x="40" y="24" width="12" height="12" rx="2" fill="var(--high)" />
  <rect x="56" y="24" width="12" height="12" rx="2" fill="var(--medium)" />
  <rect x="40" y="40" width="12" height="12" rx="2" fill="var(--medium)" />
  <rect x="72" y="40" width="12" height="12" rx="2" fill="var(--high)" />
  <rect x="40" y="56" width="12" height="12" rx="2" fill="var(--high)" />
  <rect x="56" y="56" width="12" height="12" rx="2" fill="var(--medium)" />
  <rect x="40" y="72" width="12" height="12" rx="2" fill="var(--low)" />
  <rect x="72" y="72" width="12" height="12" rx="2" fill="var(--high)" />
  <rect x="40" y="88" width="12" height="12" rx="2" fill="var(--medium)" />
  <rect x="72" y="88" width="12" height="12" rx="2" fill="var(--low)" />
  </g>
</svg>
